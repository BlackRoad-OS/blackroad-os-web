<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BlackRoad OS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none}
body{background:#0a0a0a;color:#d4d4d4;font-family:'Segoe UI',system-ui,sans-serif;overflow:hidden;height:100vh;cursor:default}

/* Desktop */
#desktop{position:absolute;top:0;left:0;right:0;bottom:36px;overflow:hidden}
#desktop-icons{padding:16px;display:flex;flex-direction:column;gap:8px;align-items:flex-start;position:absolute;top:0;left:0}
.desktop-icon{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 10px;border-radius:4px;cursor:pointer;width:76px;text-align:center}
.desktop-icon:hover{background:rgba(255,255,255,.06)}
.desktop-icon.selected{background:rgba(255,34,85,.15);outline:1px solid rgba(255,34,85,.3)}
.desktop-icon .ico{width:40px;height:40px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:20px}
.desktop-icon .lbl{font-size:10px;color:#a3a3a3;line-height:1.2;word-break:break-word}

/* Window */
.window{position:absolute;background:#111;border:1px solid #262626;border-radius:8px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 8px 40px rgba(0,0,0,.6);min-width:300px;min-height:200px}
.window.focused{z-index:100;box-shadow:0 12px 60px rgba(0,0,0,.8);border-color:#333}
.window.maximized{top:0!important;left:0!important;width:100%!important;height:100%!important;border-radius:0}
.titlebar{height:32px;background:#161616;border-bottom:1px solid #1a1a1a;display:flex;align-items:center;padding:0 8px;gap:8px;cursor:grab;flex-shrink:0}
.titlebar:active{cursor:grabbing}
.titlebar .title-icon{width:16px;height:16px;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:10px;flex-shrink:0}
.titlebar .title-text{font-size:12px;color:#a3a3a3;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.titlebar-btns{display:flex;gap:2px}
.titlebar-btn{width:24px;height:24px;border:none;background:none;color:#525252;font-size:14px;cursor:pointer;border-radius:3px;display:flex;align-items:center;justify-content:center;line-height:1}
.titlebar-btn:hover{background:#262626;color:#d4d4d4}
.titlebar-btn.close:hover{background:#FF2255;color:#fff}
.window-body{flex:1;overflow:auto;position:relative}

/* Taskbar */
#taskbar{position:fixed;bottom:0;left:0;right:0;height:36px;background:#111;border-top:1px solid #1a1a1a;display:flex;align-items:center;z-index:999}
#start-btn{height:36px;padding:0 14px;background:none;border:none;color:#d4d4d4;font-size:12px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:8px;border-right:1px solid #1a1a1a}
#start-btn:hover{background:#1a1a1a}
#start-btn .dots{display:flex;gap:2px}
#start-btn .dots span{width:5px;height:5px;border-radius:50%}
#taskbar-items{flex:1;display:flex;gap:2px;padding:2px 4px;overflow-x:auto}
.taskbar-item{height:28px;padding:0 12px;background:#0a0a0a;border:1px solid #1a1a1a;border-radius:4px;font-size:11px;color:#737373;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap}
.taskbar-item.active{background:#1a1a1a;border-color:#333;color:#d4d4d4}
.taskbar-item .ti-dot{width:4px;height:4px;border-radius:50%}
#clock{padding:0 12px;font-size:11px;color:#525252;font-variant-numeric:tabular-nums;border-left:1px solid #1a1a1a;height:100%;display:flex;align-items:center;gap:8px}
#tray{display:flex;align-items:center;gap:6px;padding:0 8px;border-left:1px solid #1a1a1a;height:100%}
.tray-dot{width:5px;height:5px;border-radius:50%;opacity:.6}

/* Resize handle */
.resize-handle{position:absolute;bottom:0;right:0;width:14px;height:14px;cursor:nwse-resize}
.resize-handle::after{content:'';position:absolute;bottom:3px;right:3px;width:8px;height:8px;border-right:2px solid #333;border-bottom:2px solid #333}

/* Window animations */
.window{animation:winOpen .2s ease}
@keyframes winOpen{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
.window.closing{animation:winClose .15s ease forwards}
@keyframes winClose{to{opacity:0;transform:scale(.95)}}

/* Notifications */
#notif-area{position:fixed;top:8px;right:8px;z-index:2000;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.notif{background:#161616;border:1px solid #262626;border-radius:8px;padding:10px 14px;font-size:11px;color:#a3a3a3;pointer-events:auto;animation:notifIn .3s ease;max-width:280px;display:flex;gap:8px;align-items:flex-start}
.notif .notif-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;margin-top:4px}
.notif.out{animation:notifOut .3s ease forwards}
@keyframes notifIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
@keyframes notifOut{to{opacity:0;transform:translateX(20px)}}

/* Selection rectangle */
#sel-rect{position:absolute;border:1px solid rgba(255,34,85,.3);background:rgba(255,34,85,.05);pointer-events:none;display:none;z-index:5}

/* Wallpaper subtle grid */
#desktop{background-image:radial-gradient(circle at 1px 1px,#111 1px,transparent 0);background-size:32px 32px}

/* Keyboard shortcut overlay */
#kb-help{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:3000;display:none;align-items:center;justify-content:center}
#kb-help.open{display:flex}
#kb-help .inner{background:#111;border:1px solid #262626;border-radius:12px;padding:24px;max-width:400px;width:90%}
#kb-help h3{font-size:14px;color:#e5e5e5;margin-bottom:12px}
.kb-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #111;font-size:12px}
.kb-row .key{background:#1a1a1a;border:1px solid #262626;border-radius:3px;padding:1px 6px;font-family:monospace;font-size:11px;color:#a3a3a3}
.kb-row .desc{color:#737373}

/* SSH Fleet */
.ssh-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:6px;height:100%;padding:6px}
.ssh-pane{background:#080808;border:1px solid #1a1a1a;border-radius:6px;display:flex;flex-direction:column;overflow:hidden;min-height:0}
.ssh-pane-header{height:24px;background:#111;border-bottom:1px solid #1a1a1a;display:flex;align-items:center;padding:0 8px;gap:6px;font-size:10px;color:#525252;flex-shrink:0}
.ssh-pane-header .ssh-dot{width:5px;height:5px;border-radius:50%}
.ssh-pane-body{flex:1;overflow-y:auto;padding:6px 8px;font-family:'Courier New',monospace;font-size:11px;line-height:1.5;color:#737373;white-space:pre-wrap;min-height:0}
.ssh-pane-body .ssh-prompt{color:#404040}
.ssh-pane-body .ssh-out{color:#525252}

/* Agent Operator */
.operator-app{display:flex;height:100%;overflow:hidden}
.operator-sidebar{width:200px;border-right:1px solid #1a1a1a;display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto}
.operator-agent{display:flex;align-items:center;gap:8px;padding:10px 12px;cursor:pointer;border-bottom:1px solid #111;font-size:12px;color:#737373;transition:background .15s}
.operator-agent:hover,.operator-agent.active{background:#111;color:#d4d4d4}
.operator-agent .oa-dot{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:#000;flex-shrink:0}
.operator-agent .oa-status{width:6px;height:6px;border-radius:50%;margin-left:auto;flex-shrink:0}
.operator-main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.operator-toolbar{height:32px;background:#111;border-bottom:1px solid #1a1a1a;display:flex;align-items:center;padding:0 12px;gap:8px;flex-shrink:0}
.operator-toolbar .ot-label{font-size:11px;color:#525252}
.operator-toolbar .ot-task{font-size:11px;color:#a3a3a3;flex:1}
.operator-screen{flex:1;background:#080808;position:relative;overflow:hidden}
.operator-screen .cursor-agent{position:absolute;width:12px;height:18px;pointer-events:none;z-index:10;transition:left .8s ease,top .8s ease}
.operator-screen .cursor-agent svg{width:12px;height:18px}
.operator-log{height:100px;border-top:1px solid #1a1a1a;overflow-y:auto;padding:8px;font-family:monospace;font-size:10px;color:#404040;flex-shrink:0}
.operator-log .ol-action{color:#737373;border-bottom:1px solid #0a0a0a;padding:3px 0}
.operator-log .ol-action .ol-type{color:#FF2255;margin-right:6px}

/* Calculator */
.calc-app{padding:16px;max-width:280px;margin:0 auto}
.calc-display{background:#080808;border:1px solid #1a1a1a;border-radius:8px;padding:12px 16px;text-align:right;font-family:'Courier New',monospace;font-size:28px;color:#e5e5e5;margin-bottom:12px;min-height:52px;overflow:hidden}
.calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.calc-btn{background:#161616;border:1px solid #1a1a1a;border-radius:6px;padding:14px;text-align:center;cursor:pointer;font-size:16px;color:#a3a3a3;transition:background .1s}
.calc-btn:hover{background:#1a1a1a;color:#e5e5e5}
.calc-btn.op{color:#FF2255}
.calc-btn.eq{background:#FF2255;color:#fff;border-color:#FF2255}
.calc-btn.eq:hover{background:#e01e4d}

/* Start Menu */
#start-menu{position:fixed;bottom:36px;left:0;width:280px;background:#111;border:1px solid #262626;border-radius:0 8px 0 0;z-index:1000;display:none;flex-direction:column;box-shadow:0 -8px 40px rgba(0,0,0,.6)}
#start-menu.open{display:flex}
#start-menu .sm-header{padding:12px 16px;border-bottom:1px solid #1a1a1a;display:flex;align-items:center;gap:10px}
#start-menu .sm-header .sm-logo{display:flex;gap:2px}
#start-menu .sm-header .sm-logo span{width:6px;height:6px;border-radius:50%}
#start-menu .sm-header .sm-title{font-size:13px;font-weight:600;color:#e5e5e5}
#start-menu .sm-items{padding:6px}
.sm-item{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:4px;cursor:pointer;font-size:12px;color:#a3a3a3}
.sm-item:hover{background:#1a1a1a;color:#e5e5e5}
.sm-item .smi{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
#start-menu .sm-footer{padding:8px 16px;border-top:1px solid #1a1a1a;font-size:10px;color:#333}

/* App: Terminal */
.terminal{background:#0a0a0a;padding:12px;font-family:'Courier New',monospace;font-size:13px;line-height:1.6;height:100%;overflow-y:auto;color:#a3a3a3}
.terminal .prompt{color:#525252}
.terminal .cmd{color:#d4d4d4}
.terminal .out{color:#737373}
.terminal input{background:none;border:none;color:#d4d4d4;font-family:inherit;font-size:inherit;outline:none;width:calc(100% - 20px);caret-color:#d4d4d4}

/* App: Chat */
.chat-app{display:flex;flex-direction:column;height:100%}
.chat-msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.chat-bubble{max-width:80%;padding:8px 12px;border-radius:8px;font-size:12px;line-height:1.5}
.chat-bubble.agent{align-self:flex-start;background:#1a1a1a;border-left:2px solid #FF2255}
.chat-bubble.user{align-self:flex-end;background:#161616;border:1px solid #1a1a1a}
.chat-input-bar{display:flex;border-top:1px solid #1a1a1a;padding:8px}
.chat-input-bar input{flex:1;background:#0a0a0a;border:1px solid #1a1a1a;border-radius:6px;padding:8px 12px;color:#d4d4d4;font-size:12px;outline:none}
.chat-input-bar button{margin-left:6px;background:#FF2255;color:#fff;border:none;border-radius:6px;padding:8px 16px;font-size:12px;cursor:pointer;font-weight:600}

/* App: Files */
.files-app{padding:12px}
.files-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:8px}
.file-item{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px;border-radius:6px;cursor:pointer;text-align:center}
.file-item:hover{background:#1a1a1a}
.file-item .fi{width:36px;height:36px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:18px}
.file-item .fn{font-size:10px;color:#737373;word-break:break-all}

/* App: Status */
.status-app{padding:16px;font-size:12px}
.status-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #111}
.status-name{color:#a3a3a3}
.status-val{font-variant-numeric:tabular-nums}
.status-dot{width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:6px}

/* Boot screen */
#boot{position:fixed;inset:0;background:#000;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .5s}
#boot.done{opacity:0;pointer-events:none}
#boot .logo{display:flex;gap:3px;margin-bottom:16px}
#boot .logo span{width:8px;height:8px;border-radius:50%}
#boot .boot-text{font-size:12px;color:#333;font-family:monospace}
#boot .bar{width:200px;height:2px;background:#1a1a1a;border-radius:1px;margin-top:12px;overflow:hidden}
#boot .bar-fill{height:100%;width:0;background:linear-gradient(90deg,#FF2255,#8844FF);transition:width 1.5s ease}

/* Context menu */
#ctx-menu{position:fixed;background:#161616;border:1px solid #262626;border-radius:6px;z-index:2000;display:none;min-width:160px;padding:4px;box-shadow:0 4px 20px rgba(0,0,0,.5)}
#ctx-menu.open{display:block}
.ctx-item{padding:6px 12px;font-size:12px;color:#a3a3a3;border-radius:3px;cursor:pointer}
.ctx-item:hover{background:#1a1a1a;color:#e5e5e5}
.ctx-sep{height:1px;background:#1a1a1a;margin:4px 0}
</style>
</head>
<body>

<!-- Boot Screen -->
<div id="boot">
  <div class="logo">
    <span style="background:#FF6B2B"></span>
    <span style="background:#FF2255"></span>
    <span style="background:#CC00AA"></span>
    <span style="background:#8844FF"></span>
    <span style="background:#4488FF"></span>
    <span style="background:#00D4FF"></span>
  </div>
  <div class="boot-text" id="boot-text">BlackRoad OS v2.1.0</div>
  <div class="bar"><div class="bar-fill" id="boot-bar"></div></div>
</div>

<!-- Desktop -->
<div id="desktop">
  <div id="desktop-icons"></div>
</div>

<!-- Taskbar -->
<div id="taskbar">
  <button id="start-btn" onclick="toggleStart()">
    <span class="dots">
      <span style="background:#FF2255"></span>
      <span style="background:#8844FF"></span>
    </span>
    Start
  </button>
  <div id="taskbar-items"></div>
  <div id="clock"></div>
</div>

<!-- Start Menu -->
<div id="start-menu"></div>

<!-- Context Menu -->
<div id="ctx-menu"></div>

<script>
// ── App Registry ──
var APPS = [
  {id:'terminal',name:'Terminal',icon:'>', color:'#333',desk:true,w:600,h:380},
  {id:'chat',name:'RoadChat',icon:'◆', color:'#FF2255',desk:true,w:420,h:500},
  {id:'files',name:'Files',icon:'□', color:'#8844FF',desk:true,w:500,h:400},
  {id:'status',name:'Fleet Status',icon:'●', color:'#4488FF',desk:true,w:480,h:360},
  {id:'search',name:'RoadSearch',icon:'/', color:'#FF6B2B',desk:true,w:500,h:400},
  {id:'browser',name:'RoadView',icon:'◎', color:'#00D4FF',desk:true,w:700,h:500},
  {id:'canvas',name:'Canvas',icon:'■', color:'#CC00AA',desk:false,w:520,h:420},
  {id:'settings',name:'Settings',icon:'◈', color:'#525252',desk:false,w:400,h:350},
  {id:'agents',name:'Passenger',icon:'◇', color:'#22c55e',desk:true,w:500,h:400},
  {id:'notes',name:'Notes',icon:'≡', color:'#F5A623',desk:true,w:400,h:350},
  {id:'music',name:'RoadWave',icon:'♫', color:'#CC00AA',desk:true,w:640,h:480},
  {id:'oneway',name:'OneWay',icon:'⟲', color:'#F5A623',desk:true,w:560,h:440},
  {id:'carpool',name:'CarPool',icon:'⊕', color:'#22c55e',desk:true,w:660,h:500},
  {id:'roadtrip',name:'RoadTrip',icon:'◈', color:'#FF2255',desk:true,w:680,h:520},
  {id:'tutor',name:'Tutor',icon:'△', color:'#8844FF',desk:false,w:500,h:420},
  {id:'hq',name:'Pixel HQ',icon:'⬡', color:'#FF6B2B',desk:false,w:500,h:450},
  {id:'ssh',name:'SSH Fleet',icon:'⊞', color:'#22c55e',desk:true,w:700,h:480},
  {id:'operator',name:'Agent Operator',icon:'◉', color:'#FF2255',desk:true,w:720,h:520},
  {id:'mail',name:'Mail',icon:'✉', color:'#F5A623',desk:false,w:500,h:400},
  {id:'calc',name:'Calculator',icon:'⊕', color:'#525252',desk:false,w:320,h:420},
  {id:'weather',name:'Weather',icon:'◐', color:'#4488FF',desk:false,w:360,h:340},
  {id:'tasks',name:'Cadence',icon:'☰', color:'#CC00AA',desk:true,w:500,h:420},
  {id:'osmanager',name:'OS Manager',icon:'⊡', color:'#FF6B2B',desk:true,w:640,h:480},
  {id:'vm',name:'RoadVM',icon:'⬚', color:'#8844FF',desk:false,w:600,h:420},
  {id:'docker',name:'Containers',icon:'⊟', color:'#4488FF',desk:false,w:560,h:400},
  {id:'pkgmgr',name:'Packages',icon:'⊞', color:'#00D4FF',desk:false,w:580,h:440},
  {id:'sysmon',name:'System Monitor',icon:'◈', color:'#22c55e',desk:true,w:550,h:400},
  {id:'netmap',name:'Network Map',icon:'⬡', color:'#CC00AA',desk:false,w:600,h:450},
  {id:'appstore',name:'PitStop',icon:'⊛', color:'#FF2255',desk:true,w:680,h:520},
  {id:'websites',name:'All Websites',icon:'◎', color:'#4488FF',desk:true,w:600,h:460},
  {id:'orgs',name:'GitHub Orgs',icon:'⊕', color:'#8844FF',desk:false,w:560,h:440},
  {id:'roadtv',name:'RoadTV',icon:'▶', color:'#FF2255',desk:true,w:720,h:540},
  {id:'backroad',name:'BackRoad',icon:'◆', color:'#FF6B2B',desk:true,w:640,h:500},
  {id:'roadcode',name:'RoadCode',icon:'⟨⟩', color:'#00D4FF',desk:true,w:680,h:500},
  {id:'roadwork',name:'RoadWork',icon:'△', color:'#8844FF',desk:true,w:720,h:540},
];

var windows = {};
var winZ = 10;
var focusedWin = null;

// ── Boot ──
setTimeout(function(){ document.getElementById('boot-bar').style.width='100%'; },100);
setTimeout(function(){
  document.getElementById('boot-text').textContent='Loading desktop...';
},800);
setTimeout(function(){
  document.getElementById('boot').classList.add('done');
  initDesktop();
},2000);

// ── Desktop Icons ──
function initDesktop(){
  var cont = document.getElementById('desktop-icons');
  APPS.filter(function(a){return a.desk}).forEach(function(app){
    var d = document.createElement('div');
    d.className='desktop-icon';
    d.ondblclick=function(){openApp(app.id)};
    d.onclick=function(e){
      document.querySelectorAll('.desktop-icon').forEach(function(x){x.classList.remove('selected')});
      d.classList.add('selected');
      e.stopPropagation();
    };
    d.innerHTML='<div class="ico" style="background:#161616;border:1px solid #1a1a1a"><span style="color:'+app.color+'">'+app.icon+'</span></div><div class="lbl">'+app.name+'</div>';
    cont.appendChild(d);
  });
  buildStartMenu();
  updateClock();
  setInterval(updateClock,10000);
  document.getElementById('desktop').addEventListener('click',function(){
    document.querySelectorAll('.desktop-icon').forEach(function(x){x.classList.remove('selected')});
    closeStart();
  });
  document.getElementById('desktop').addEventListener('contextmenu',function(e){
    e.preventDefault();
    showCtx(e.clientX,e.clientY,[
      {label:'Open Terminal',fn:function(){openApp('terminal')}},
      {label:'Open Chat',fn:function(){openApp('chat')}},
      {label:'Fleet Status',fn:function(){openApp('status')}},
      {sep:true},
      {label:'Refresh',fn:function(){location.reload()}},
    ]);
  });
  document.addEventListener('click',function(){closeCtx()});
}

// ── Start Menu ──
function buildStartMenu(){
  var m=document.getElementById('start-menu');
  m.innerHTML='<div class="sm-header"><div class="sm-logo"><span style="background:#FF6B2B"></span><span style="background:#FF2255"></span><span style="background:#CC00AA"></span><span style="background:#8844FF"></span><span style="background:#4488FF"></span><span style="background:#00D4FF"></span></div><div class="sm-title">BlackRoad OS</div></div><div class="sm-items">'+APPS.map(function(a){return '<div class="sm-item" onclick="openApp(\''+a.id+'\');closeStart()"><div class="smi" style="background:#161616;border:1px solid #1a1a1a"><span style="color:'+a.color+'">'+a.icon+'</span></div><div>'+a.name+'</div></div>'}).join('')+'</div><div class="sm-footer">BlackRoad OS, Inc. — v2.1.0</div>';
}
function toggleStart(){document.getElementById('start-menu').classList.toggle('open')}
function closeStart(){document.getElementById('start-menu').classList.remove('open')}

// ── Context Menu ──
function showCtx(x,y,items){
  var m=document.getElementById('ctx-menu');
  m.innerHTML=items.map(function(i){return i.sep?'<div class="ctx-sep"></div>':'<div class="ctx-item" onclick="event.stopPropagation()">'+i.label+'</div>'}).join('');
  m.querySelectorAll('.ctx-item').forEach(function(el,idx){
    var item=items.filter(function(i){return !i.sep})[idx];
    if(item)el.onclick=function(){item.fn();closeCtx()};
  });

// ── Window Manager ──
function openApp(id){
  closeStart();
  if(windows[id]){focusWin(id);return}
  var app=APPS.find(function(a){return a.id===id});
  if(!app)return;
  var win=document.createElement('div');
  win.className='window focused';
  win.id='win-'+id;
  win.style.width=app.w+'px';
  win.style.height=app.h+'px';
  win.style.left=Math.max(40,60+Object.keys(windows).length*30)+'px';
  win.style.top=Math.max(20,40+Object.keys(windows).length*30)+'px';
  win.style.zIndex=++winZ;
  win.innerHTML='<div class="titlebar" data-win="'+id+'"><div class="title-icon" style="background:#161616;border:1px solid #1a1a1a"><span style="color:'+app.color+';font-size:9px">'+app.icon+'</span></div><span class="title-text">'+app.name+'</span><div class="titlebar-btns"><button class="titlebar-btn" onclick="minimizeWin(\''+id+'\')">−</button><button class="titlebar-btn" onclick="maximizeWin(\''+id+'\')">□</button><button class="titlebar-btn close" onclick="closeWin(\''+id+'\')">×</button></div></div><div class="window-body" id="body-'+id+'"></div><div class="resize-handle" data-win="'+id+'"></div>';
  makeResizable(win);
  win.onmousedown=function(){focusWin(id)};
  document.getElementById('desktop').appendChild(win);
  windows[id]={el:win,app:app,minimized:false,maximized:false};
  makeDraggable(win,win.querySelector('.titlebar'));
  focusWin(id);
  renderApp(id);
  updateTaskbar();
}

function closeWin(id){
  if(!windows[id])return;
  windows[id].el.remove();
  delete windows[id];
  updateTaskbar();
}
function minimizeWin(id){
  if(!windows[id])return;
  windows[id].el.style.display='none';
  windows[id].minimized=true;
  updateTaskbar();
}
function maximizeWin(id){
  var w=windows[id];if(!w)return;
  if(w.maximized){
    w.el.classList.remove('maximized');
    w.maximized=false;
  } else {
    w.el.classList.add('maximized');
    w.maximized=true;
  }
}
function focusWin(id){
  if(!windows[id])return;
  Object.values(windows).forEach(function(w){w.el.classList.remove('focused')});
  var w=windows[id];
  w.el.style.display='flex';
  w.minimized=false;
  w.el.style.zIndex=++winZ;
  w.el.classList.add('focused');
  focusedWin=id;
  updateTaskbar();
}

function makeDraggable(el,handle){
  var dx=0,dy=0,mx=0,my=0,dragging=false;
  handle.onmousedown=function(e){
    if(e.target.closest('.titlebar-btns'))return;
    dragging=true;mx=e.clientX;my=e.clientY;
    document.onmousemove=function(e){
      if(!dragging)return;
      dx=mx-e.clientX;dy=my-e.clientY;mx=e.clientX;my=e.clientY;
      el.style.left=Math.max(0,el.offsetLeft-dx)+'px';
      el.style.top=Math.max(0,el.offsetTop-dy)+'px';
      if(el.classList.contains('maximized')){el.classList.remove('maximized');windows[el.id.replace('win-','')].maximized=false}
    };
    document.onmouseup=function(){dragging=false;document.onmousemove=null;document.onmouseup=null};
  };
}

function updateTaskbar(){
  var cont=document.getElementById('taskbar-items');
  cont.innerHTML='';
  Object.keys(windows).forEach(function(id){
    var w=windows[id];
    var d=document.createElement('div');
    d.className='taskbar-item'+(focusedWin===id&&!w.minimized?' active':'');
    d.innerHTML='<span class="ti-dot" style="background:'+w.app.color+'"></span>'+w.app.name;
    d.onclick=function(){
      if(focusedWin===id&&!w.minimized)minimizeWin(id);
      else focusWin(id);
    };
    cont.appendChild(d);
  });
}

function updateClock(){
  var d=new Date();
  document.getElementById('clock').textContent=d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0');
}

function renderChat(el){

var chatConvId=null;
function sendChat(){
  var inp=document.getElementById('chat-in'),msg=inp.value.trim();if(!msg)return;inp.value='';
  var el=document.getElementById('chat-msgs');
  el.innerHTML+='<div class="chat-bubble user">'+msg.replace(/</g,'&lt;')+'</div>';
  el.scrollTop=el.scrollHeight;
  var bubble=document.createElement('div');bubble.className='chat-bubble agent';bubble.textContent='...';el.appendChild(bubble);
  (chatConvId?Promise.resolve(chatConvId):fetch('https://chat.blackroad.io/api/conversations',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({agent_id:'road',user_id:'desktop-'+Math.random().toString(36).slice(2,6)})}).then(function(r){return r.json()}).then(function(d){chatConvId=d.id;return d.id})).then(function(cid){
    return fetch('https://chat.blackroad.io/api/conversations/'+cid+'/messages/stream',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({content:msg})});
  }).then(function(r){
    var reader=r.body.getReader(),dec=new TextDecoder(),full='';
    function pump(){reader.read().then(function(x){if(x.done)return;dec.decode(x.value,{stream:true}).split('\n').forEach(function(l){if(l.startsWith('data: ')&&!l.includes('[DONE]')){try{var d=JSON.parse(l.slice(6));if(d.response){full+=d.response;bubble.textContent=full}}catch(e){}}});el.scrollTop=el.scrollHeight;pump()})}pump();
  }).catch(function(){bubble.textContent='Connection error.'});
}

function makeResizable(win){

    var startW=win.offsetWidth,startH=win.offsetHeight,startX=e.clientX,startY=e.clientY;
    document.onmousemove=function(e){
      win.style.width=Math.max(300,startW+(e.clientX-startX))+'px';
      win.style.height=Math.max(200,startH+(e.clientY-startY))+'px';
    };
    document.onmouseup=function(){document.onmousemove=null;document.onmouseup=null};
  };
}

(function(){

    if(!rect){rect=document.createElement('div');rect.id='sel-rect';document.getElementById('desktop').appendChild(rect)}
    startX=e.clientX;startY=e.clientY;dragging=true;
    rect.style.left=startX+'px';rect.style.top=startY+'px';rect.style.width='0';rect.style.height='0';rect.style.display='block';
  });
  document.addEventListener('mousemove',function(e){
    if(!dragging||!rect)return;
    var x=Math.min(e.clientX,startX),y=Math.min(e.clientY,startY);
    rect.style.left=x+'px';rect.style.top=y+'px';
    rect.style.width=Math.abs(e.clientX-startX)+'px';rect.style.height=Math.abs(e.clientY-startY)+'px';
  });
  document.addEventListener('mouseup',function(){
    dragging=false;if(rect)rect.style.display='none';
  });
})();

  // Build a fake browser view
  var sites=['blackroad.io','chat.blackroad.io','search.blackroad.io','github.com/BlackRoad-OS-Inc','tutor.blackroad.io','pay.blackroad.io'];

  log.innerHTML='';

  // Simulate agent actions
  var actions=[
    {type:'navigate',desc:'Opening '+currentSite},
    {type:'scroll',desc:'Scrolling to products section'},
    {type:'click',desc:'Clicking "Get Started" button',x:60,y:70},
    {type:'type',desc:'Typing search query: "fleet status"'},
    {type:'click',desc:'Clicking search result',x:40,y:45},
    {type:'read',desc:'Reading page content...'},
    {type:'scroll',desc:'Scrolling to review output'},
    {type:'click',desc:'Clicking "Deploy" button',x:75,y:80},
    {type:'wait',desc:'Waiting for deployment...'},
    {type:'verify',desc:'Verifying deployment succeeded'},
    {type:'navigate',desc:'Opening status.blackroad.io'},
    {type:'read',desc:'Checking all services are healthy'},
  ];

  var cursor=document.getElementById('op-cursor');
  var label=document.getElementById('op-action-label');
  var i=0;

  function doAction(){
    if(i>=actions.length){
      addLog('complete','Task finished. All actions completed.');
      label.textContent='Done';label.style.display='block';
      return;
    }
    var a=actions[i];
    addLog(a.type,a.desc);

    // Move cursor
    if(a.x!==undefined){
      cursor.style.left=a.x+'%';cursor.style.top=a.y+'%';
    } else {
      cursor.style.left=Math.random()*70+15+'%';cursor.style.top=Math.random()*60+20+'%';
    }

    // Show action label
    label.textContent=a.desc;label.style.display='block';

    // Navigate to new page sometimes
    if(a.type==='navigate'&&i>0){
      var newSite=sites[Math.floor(Math.random()*sites.length)];
      document.getElementById('op-url').textContent='https://'+newSite;
      var vp=document.getElementById('op-viewport');
      var iframe=vp.querySelector('iframe');
      if(iframe)iframe.src='https://'+newSite;
    }

    i++;
    setTimeout(doAction,1500+Math.random()*2000);
  }

  function addLog(type,desc){

    d.innerHTML='<span style="color:#333">'+ts+'</span> <span class="ol-type">['+type+']</span> '+desc;
    log.appendChild(d);log.scrollTop=log.scrollHeight;
  }

  setTimeout(doAction,800);
}

function renderCalc(el){
  el.innerHTML='<div class="calc-app"><div class="calc-display" id="calc-disp">0</div><div class="calc-grid" id="calc-grid"></div></div>';
  var btns=['C','±','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','0','.','⌫','='];
  var grid=document.getElementById('calc-grid');
  btns.forEach(function(b){
    var d=document.createElement('div');d.className='calc-btn';
    if('÷×−+%±'.includes(b))d.classList.add('op');
    if(b==='=')d.classList.add('eq');
    d.textContent=b;d.onclick=function(){calcPress(b)};
    grid.appendChild(d);
  });
  window._calcVal='0';window._calcOp=null;window._calcPrev=null;window._calcNew=true;
}
function calcPress(b){
  var disp=document.getElementById('calc-disp');
  if(b==='C'){window._calcVal='0';window._calcOp=null;window._calcPrev=null;window._calcNew=true;disp.textContent='0';return}
  if(b==='⌫'){window._calcVal=window._calcVal.slice(0,-1)||'0';disp.textContent=window._calcVal;return}
  if(b==='±'){window._calcVal=String(-parseFloat(window._calcVal));disp.textContent=window._calcVal;return}
  if('÷×−+'.includes(b)){window._calcPrev=parseFloat(window._calcVal);window._calcOp=b;window._calcNew=true;return}
  if(b==='='){
    if(window._calcOp&&window._calcPrev!==null){
      var cur=parseFloat(window._calcVal);var r=0;
      if(window._calcOp==='+')r=window._calcPrev+cur;
      if(window._calcOp==='−')r=window._calcPrev-cur;
      if(window._calcOp==='×')r=window._calcPrev*cur;
      if(window._calcOp==='÷')r=cur?window._calcPrev/cur:0;
      window._calcVal=String(Math.round(r*1e10)/1e10);disp.textContent=window._calcVal;
      window._calcOp=null;window._calcPrev=null;window._calcNew=true;
    }
    return;
  }
  if(b==='%'){window._calcVal=String(parseFloat(window._calcVal)/100);disp.textContent=window._calcVal;return}
  if(window._calcNew){window._calcVal=b==='.'?'0.':b;window._calcNew=false}
  else{window._calcVal+=b}
  disp.textContent=window._calcVal;
}

ween;font-size:10px;margin-bottom:3px"><span style="color:#525252">Gematria /</span><span style="color:#a3a3a3">66%</span></div><div style="background:#1a1a1a;height:4px;border-radius:2px"><div style="width:66%;height:100%;background:#eab308;border-radius:2px"></div></div></div><div><div style="display:flex;justify-content:space-between;font-size:10px;margin-bottom:3px"><span style="color:#525252">Anastasia /</span><span style="color:#ef4444">94%</span></div><div style="background:#1a1a1a;height:4px;border-radius:2px"><div style="width:94%;height:100%;background:#ef4444;border-radius:2px"></div></div></div></div></div></div></div>';

    ctx.stroke();
    ctx.lineTo(w,h);ctx.lineTo(0,h);ctx.closePath();
    ctx.fillStyle=color+'15';ctx.fill();

// ── Network Map ──
function renderNetMap(el){
  el.innerHTML='<canvas id="netmap-canvas" style="width:100%;height:100%;background:#050505"></canvas>';
  setTimeout(function(){
    var c=document.getElementById('netmap-canvas');if(!c)return;
    c.width=c.offsetWidth*2;c.height=c.offsetHeight*2;
    var ctx=c.getContext('2d');ctx.scale(2,2);
    var w=c.offsetWidth,h=c.offsetHeight;
    var nodes=[
      {name:'Alice',x:w*0.2,y:h*0.3,color:'#FF6B2B',r:18},
      {name:'Cecilia',x:w*0.35,y:h*0.7,color:'#ef4444',r:16},
      {name:'Octavia',x:w*0.5,y:h*0.2,color:'#CC00AA',r:18},
      {name:'Aria',x:w*0.65,y:h*0.6,color:'#8844FF',r:16},
      {name:'Lucidia',x:w*0.3,y:h*0.5,color:'#4488FF',r:17},
      {name:'Gematria',x:w*0.75,y:h*0.3,color:'#22c55e',r:20},
      {name:'Anastasia',x:w*0.85,y:h*0.7,color:'#00D4FF',r:14},
      {name:'Alexandria',x:w*0.5,y:h*0.5,color:'#F5A623',r:22},
    ];
    // Draw connections (WireGuard mesh)
    ctx.strokeStyle='#1a1a1a';ctx.lineWidth=0.5;
    for(var i=0;i<nodes.length;i++){
      for(var j=i+1;j<nodes.length;j++){
        if(nodes[i].color==='#ef4444'||nodes[j].color==='#ef4444')continue; // Cecilia offline
        ctx.beginPath();ctx.moveTo(nodes[i].x,nodes[i].y);ctx.lineTo(nodes[j].x,nodes[j].y);ctx.stroke();
      }
    }
    // Draw nodes
    nodes.forEach(function(n){
      ctx.beginPath();ctx.arc(n.x,n.y,n.r,0,Math.PI*2);
      ctx.fillStyle=n.color+'20';ctx.fill();
      ctx.strokeStyle=n.color;ctx.lineWidth=1.5;ctx.stroke();
      ctx.fillStyle=n.color;ctx.font='bold 9px system-ui';ctx.textAlign='center';
      ctx.fillText(n.name,n.x,n.y+n.r+12);
      // Dot in center
      ctx.beginPath();ctx.arc(n.x,n.y,3,0,Math.PI*2);ctx.fillStyle=n.color;ctx.fill();
    });
    // Animated packets
    var packets=[];
    function addPacket(){
      var from=nodes[Math.floor(Math.random()*nodes.length)];
      var to=nodes[Math.floor(Math.random()*nodes.length)];
      if(from===to||from.color==='#ef4444'||to.color==='#ef4444')return;
      packets.push({x:from.x,y:from.y,tx:to.x,ty:to.y,t:0,color:from.color});
    }
    function animPackets(){
      ctx.clearRect(0,0,w,h);
      // Redraw connections
      ctx.strokeStyle='#111';ctx.lineWidth=0.5;
      for(var i=0;i<nodes.length;i++){for(var j=i+1;j<nodes.length;j++){if(nodes[i].color==='#ef4444'||nodes[j].color==='#ef4444')continue;ctx.beginPath();ctx.moveTo(nodes[i].x,nodes[i].y);ctx.lineTo(nodes[j].x,nodes[j].y);ctx.stroke()}}
      // Draw nodes
      nodes.forEach(function(n){ctx.beginPath();ctx.arc(n.x,n.y,n.r,0,Math.PI*2);ctx.fillStyle=n.color+'15';ctx.fill();ctx.strokeStyle=n.color+'60';ctx.lineWidth=1;ctx.stroke();ctx.fillStyle=n.color;ctx.font='bold 9px system-ui';ctx.textAlign='center';ctx.fillText(n.name,n.x,n.y+n.r+12);ctx.beginPath();ctx.arc(n.x,n.y,3,0,Math.PI*2);ctx.fill()});
      // Draw packets
      for(var p=packets.length-1;p>=0;p--){
        var pk=packets[p];pk.t+=0.02;
        if(pk.t>=1){packets.splice(p,1);continue}
        var px=pk.x+(pk.tx-pk.x)*pk.t;
        var py=pk.y+(pk.ty-pk.y)*pk.t;
        ctx.beginPath();ctx.arc(px,py,2,0,Math.PI*2);ctx.fillStyle=pk.color;ctx.fill();
      }
      requestAnimationFrame(animPackets);
    }
    setInterval(addPacket,400);
    animPackets();
  },200);
}

    {from:'Road',subj:'Welcome to BlackRoad OS',time:'1d ago',body:'Your sovereign computing environment is ready. Type T to open a terminal.',read:true},
  ];
  el.innerHTML='<div style="height:100%;display:flex;flex-direction:column"><div style="padding:8px 12px;border-bottom:1px solid #1a1a1a;font-size:11px;color:#525252">Inbox ('+emails.filter(function(e){return !e.read}).length+' unread)</div><div style="flex:1;overflow-y:auto" id="mail-list">'+emails.map(function(e,i){return '<div style="padding:10px 12px;border-bottom:1px solid #111;cursor:pointer;'+(e.read?'':'background:#0f0f0f;')+'" onclick="showEmail('+i+')"><div style="display:flex;justify-content:space-between"><div style="font-size:12px;'+(e.read?'color:#737373':'color:#e5e5e5;font-weight:600')+'">'+e.from+'</div><div style="font-size:10px;color:#333">'+e.time+'</div></div><div style="font-size:11px;color:#525252;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+e.subj+'</div></div>'}).join('')+'</div><div id="mail-body" style="display:none;flex:1;overflow-y:auto;padding:16px;border-top:1px solid #1a1a1a"></div></div>';
  window._emails=emails;
}
function showEmail(i){
  var e=window._emails[i];
  var body=document.getElementById('mail-body');
  var list=document.getElementById('mail-list');
  body.style.display='block';list.style.display='none';
  body.innerHTML='<div style="margin-bottom:12px"><div style="font-size:14px;font-weight:600;color:#e5e5e5">'+e.subj+'</div><div style="font-size:11px;color:#525252;margin-top:4px">From: '+e.from+' — '+e.time+'</div></div><div style="font-size:13px;color:#a3a3a3;line-height:1.6">'+e.body+'</div><div style="margin-top:16px"><button onclick="document.getElementById(\'mail-body\').style.display=\'none\';document.getElementById(\'mail-list\').style.display=\'block\'" style="background:#161616;border:1px solid #1a1a1a;border-radius:4px;padding:6px 12px;color:#737373;cursor:pointer;font-size:11px">Back to inbox</button></div>';
}
</script>
</body>
</html>
